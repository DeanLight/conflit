[project]
name = "conflit"
version = "0.1.1"
description = "lightweight configuration management library"
readme = "README.md"
authors = [{name = "Dean Light"}]
requires-python = ">=3.12"
dependencies = [
    "cyclopts>=4.11.2",
    "dynaconf>=3.2.0",
    "juplit>=0.0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "structlog>=25.5.0",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "poethepoet>=0.25.0",
    "ipykernel>=6.0.0",
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-jupyter>=0.24.0",
    "mkdocstrings[python]>=0.24.0",
    "rich>=15.0.0",
]

[tool.poe.tasks]
init         = {cmd = "pre-commit install", help = "Install git hooks"}
sync         = {cmd = "juplit sync", help = "Sync .py<->ipynb for all paired notebooks"}
nb           = {cmd = "juplit nb",   help = "Generate .ipynb from .py files (run after cloning)"}
clean        = {cmd = "juplit clean",help = "Sync then delete all .ipynb files"}
test         = {cmd = "pytest",      help = "Run tests"}
docs         = {cmd = "mkdocs serve",          help = "Serve docs locally for preview"}
docs-build   = {cmd = "mkdocs build",          help = "Build docs site"}
docs-deploy  = {cmd = "mkdocs gh-deploy --force", help = "Deploy docs to GitHub Pages"}

[tool.poe.tasks._check_env]
help = "Assert an env var is set before proceeding"
script = "juplit._dev:check_env"
args = [{name = "env_name", positional = true}]

[tool.poe.tasks.pypi]
help = "Build the package and publish to PyPI"
sequence = [
    {ref = "_check_env UV_PUBLISH_TOKEN"},
    {cmd = "rm -rf dist/*"},
    {cmd = "uv build"},
    {cmd = "uv publish"},
]

[tool.juplit]
notebook_src_dir = "conflit"

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.pytest.ini_options]
testpaths = ["conflit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
