database_defaults: &database_defaults
  host: db.prod.local
  port: 5432
  pool_size: 20

database:
  primary:
    <<: *database_defaults
  read_replica:
    <<: *database_defaults
    host: db-read.prod.local

service:
  api: !merge
    timeout_seconds: 45
    base_url: "https://api.prod.local"
  features: !merge
    flags: !append
      - caching
      - metrics
