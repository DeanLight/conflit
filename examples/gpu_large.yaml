# GPU-cluster overrides for a full-scale Orion training run.
# Deep-merges into the baseline so only differing keys are listed here.
# !merge lets us update nested dicts without repeating unchanged siblings.

model: !merge
  num_layers: 12
  hidden_dim: 1024
  num_heads: 16

training: !merge
  batch_size: 256
  max_epochs: 100
  warmup_steps: 2000

data: !merge
  num_workers: 16
  pin_memory: true

logging: !merge
  level: warning
  log_every_n_steps: 200

features: !append
  - distributed_training
  - compile_model
