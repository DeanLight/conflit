site_name: conflit
site_description: Layered YAML configuration with compose, merge tags, and optional Pydantic validation.
repo_url: https://github.com/DeanLight/conflit
repo_name: Dean Light/conflit

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.expand
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: .

watch:
  - README.md

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - mkdocs-jupyter:
      include: ["**/*.ipynb"]
      execute: false
      ignore_h1_titles: false

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Configuration Model: configuration_model.md
  - API Reference: api.md
